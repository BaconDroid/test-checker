name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  TSLP_LINK_MODE: static

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup component add rustfmt clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy core
        run: cargo clippy -p test-checker --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test -p test-checker --all-targets --all-features

      - name: Compile benchmarks
        run: cargo bench -p test-checker --bench test_checker --no-run

      - name: Test npm package
        run: node --test npm/test-checker/*.test.js

  build:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
            binary_name: test-checker
            archive_ext: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
            binary_name: test-checker
            archive_ext: tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
            binary_name: test-checker
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: arm64
            binary_name: test-checker
            archive_ext: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
            binary_name: test-checker.exe
            archive_ext: zip

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p test-checker --release --locked --target ${{ matrix.target }}

      - name: Sign and notarize macOS binary
        if: matrix.os_name == 'darwin'
        timeout-minutes: 75
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_SIGNING_REQUIRED: ${{ vars.MACOS_SIGNING_REQUIRED }}
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
        run: |
          bash .github/scripts/macos-sign-and-notarize.sh --identifier com.bacondroid.test-checker "$BINARY"
          printf '%s' '{"tool_name":"Write","tool_input":{"file_path":"a.ts","content":"const a = 1 // one"}}' | "$BINARY" > /dev/null || [ "$?" -eq 2 ]

      - name: Package Unix artifact
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          artifact="test-checker_${{ github.ref_name }}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz"
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" package/test-checker
          chmod +x package/test-checker
          cp LICENSE README.md package/
          tar -czf "$artifact" -C package test-checker LICENSE README.md

      - name: Package Windows artifact
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $artifact = "test-checker_${{ github.ref_name }}_${{ matrix.os_name }}_${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" package/
          Copy-Item LICENSE, README.md package/
          Compress-Archive -Path package/* -DestinationPath $artifact -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-checker_${{ matrix.os_name }}_${{ matrix.arch }}
          path: test-checker_*.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- ./*.tar.gz ./*.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## Installation

            ### npm (Recommended)
            ```bash
            npm install -g @bacondroid/test-checker
            # or
            bun add -g @bacondroid/test-checker
            ```

            ### Homebrew (macOS)
            ```bash
            brew tap BaconDroid/tap
            brew install test-checker
            ```

            ### Manual Download
            Download the appropriate Rust native binary for your platform from the assets below.

            **Supported Platforms:**
            - macOS (arm64, x64)
            - Linux (arm64, x64)
            - Windows (x64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: test-checker_darwin_arm64
          path: artifacts

      - name: Download darwin-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: test-checker_darwin_amd64
          path: artifacts

      - name: Get checksums
        id: checksums
        run: |
          ARM64_SHA=$(sha256sum "artifacts/test-checker_${{ github.ref_name }}_darwin_arm64.tar.gz" | cut -d ' ' -f 1)
          AMD64_SHA=$(sha256sum "artifacts/test-checker_${{ github.ref_name }}_darwin_amd64.tar.gz" | cut -d ' ' -f 1)
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$AMD64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}

          cat > formula.rb << 'EOF'
          class TestChecker < Formula
            desc "Multi-language test-weakening detection hook for Claude Code and OpenCode"
            homepage "https://github.com/BaconDroid/test-checker"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/BaconDroid/test-checker/releases/download/vVERSION_PLACEHOLDER/test-checker_vVERSION_PLACEHOLDER_darwin_arm64.tar.gz"
                sha256 "ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/BaconDroid/test-checker/releases/download/vVERSION_PLACEHOLDER/test-checker_vVERSION_PLACEHOLDER_darwin_amd64.tar.gz"
                sha256 "AMD64_SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "test-checker"
            end

            test do
              system "#{bin}/test-checker", "--help"
            end
          end
          EOF

          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" formula.rb
          sed -i "s/ARM64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.arm64_sha }}/g" formula.rb
          sed -i "s/AMD64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.amd64_sha }}/g" formula.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/BaconDroid/homebrew-tap.git"
          mkdir -p homebrew-tap/Formula
          cp formula.rb homebrew-tap/Formula/test-checker.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/test-checker.rb
          git commit -m "Update test-checker to v$VERSION"
          git push

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare npm packages
        run: bash .github/scripts/prepare-npm-packages.sh "${{ steps.version.outputs.version }}" "${{ github.ref_name }}" artifacts

      - name: Test npm package
        run: node --test npm/test-checker/*.test.js

      - name: Verify npm package contents
        run: bash .github/scripts/verify-npm-packages.sh "${{ steps.version.outputs.version }}"

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: bash .github/scripts/publish-npm-packages.sh "${{ steps.version.outputs.version }}"
