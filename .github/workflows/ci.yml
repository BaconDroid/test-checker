name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  TSLP_LINK_MODE: static

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup component add rustfmt clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy core
        run: cargo clippy -p test-checker --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test -p test-checker --all-targets --all-features

      - name: Compile benchmarks
        run: cargo bench -p test-checker --bench test_checker --no-run

      - name: Build release binary
        run: cargo build -p test-checker --release --locked

      - name: Test npm wrapper
        run: node --test npm/test-checker/*.test.js

  parity:
    runs-on: ubuntu-latest
    env:
      PARITY_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Parity drift check
        run: python3 parity/check.py
